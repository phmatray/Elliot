# The floor `Package.swift` declares, held true by something other than goodwill (#116, criterion 4).
#
# ### What rotted, and what this catches
#
# `swift-tools-version` said 6.1 for months while the sources needed more. Nothing noticed, for one
# structural reason: **no machine other than the author's had ever compiled the package.** The first
# runner that tried failed in under two minutes. A declared floor with nothing exercising it is not a
# weak guarantee, it is no guarantee — it is a comment that happens to sit in a manifest.
#
# So the floor is not *read* and reasoned about. It is exercised — by a real compile, on a real
# runner, on every pull request.
#
# ### Two jobs establish that, and this is the cheap half (#187)
#
# Until #187 this job compiled the package itself, and so did `ci.yml`'s `build-and-test` — the whole
# package, cold, on two `macos-26` runners with no shared cache between them. Measured across four
# pull requests: 60–70 billed macOS minutes each, of which the second compile bought nothing. Note
# what the duplication actually was, because this file's own comments used to understate it: not just
# the test targets, but `swift build` as well, in both jobs.
#
# The work is now split so that the compile happens once:
#
#   • **this job** establishes that the image *is* the floor — the runner's Swift against the version
#     `Package.swift` declares — and that `ci.yml` runs on that same image. Seconds, no compile.
#   • **`ci.yml`** establishes that the package compiles and its suite passes there. Its `swift test`
#     compiles all eight test targets, which is strictly more than the `swift build --build-tests`
#     that used to live here — that step compiled them and never ran one.
#
# The composite claim is exactly #116's, and it is unweakened: *the declared floor is real, and this
# package builds and tests on it.* What changed is that it is paid for once.
#
# ### What it cost, measured both sides (#187, criterion 3)
#
# Four sample pairs before — #102's own runs `31178996220`/`31178996284`, plus three pull requests
# from 2026-08-08 — against this change's own run after:
#
#     before   floor 2m21–3m58   +   build-and-test 2m42–3m00   =   6–7 job-min   =   60–70 billed
#     after    floor 0m09        +   build-and-test 2m38        =   4 job-min     =   40 billed
#
# After-runs: `31255937877` (floor, 9s) and `31255937885` (build-and-test, 2m38s, reporting
# `1418 tests in 158 suites` — the same suite, unchanged). **20–30 fewer billed macOS minutes per
# pull request: 33–43%.** (Stated as a percentage on purpose — the saving pairs 60→40 and 70→40, so
# "a third to two fifths" rounds the top end down and cannot be re-derived from the table.) The run
# ids are written down because GitHub drops the logs at 90 days, and this file's own history is the
# argument for not leaving a measurement only there.
#
# ⚠️ A job bills rounded **up to the whole minute**, ×10 for private macOS, which is why a 9-second
# job still costs one billed minute and why the saving is not the 3m49 of wall clock it looks like.
#
# ⚠️ The join between the two jobs is the image, so the image is **asserted, not assumed** — see the
# parity step below. Two files agreeing by comment is precisely the arrangement #116 is about. The
# dangerous direction is the quiet one: if `ci.yml` moved to an *older* image its own compile would
# fail loudly, but if it moved to a *newer* one everything would stay green while nothing compiled on
# the declared floor at all.
#
# ### Why it also fails when the runner is NEWER than the floor
#
# That reads like pedantry and is the whole point. If the image moves to a toolchain above the
# declared floor, this job goes on passing while measuring **a different toolchain than the one
# declared** — which is exactly the state the repository was in before #116, reached by a different
# route. The check would then be decorative, and a decorative check is worse than none, because it
# looks like coverage.
#
# The failure is deliberately actionable rather than merely loud: it names both ways out (re-measure
# and raise the floor, or pin the toolchain) and it should fire roughly once per Xcode release, not
# once per pull request.
#
# ### The two comparisons are at different precisions, on purpose
#
# A floor is a **minimum**, and the two ways to miss it are not symmetric:
#
#   • **Below it is a violation, at full precision.** `swift-tools-version` does carry a patch — this
#     package declares `6.3.1`, and SwiftPM enforces it (a `6.3.9` manifest is refused by a 6.3.3
#     toolchain, by name). A 6.3.0 runner against a 6.3.1 floor is genuinely below it, and truncating
#     to major.minor would wave it through — which is how the first draft of this file certified
#     exactly that case as "at the declared floor".
#   • **Above it is a coverage concern, and only at major.minor.** How much it matters scales with
#     distance, and #116's own measurement is the evidence: the verdict on this package changed at
#     6.1→6.2 and again at 6.2→6.3, and *not once* across 6.2 → 6.2.1 → 6.2.3 → 6.2.4, nor across
#     6.3.1 → 6.3.2 → 6.3.3. Minor releases are where compilers changed what they accept. Failing on
#     a patch bump would fire several times a year on a signal that has never once meant anything
#     here, and a check that cries wolf gets muted — which is the same end state as no check.
#
# ### Why there is no second, lower leg
#
# #116 chose to **raise** the floor rather than repair the sources for 6.1, so there is no older
# toolchain left to exercise. That absence is a decision, not an omission. Under the other outcome
# this file would carry a `macos-15` build leg to keep the 6.1 claim honest on every pull request.
#
# ### Why this is still not merged into `ci.yml`
#
# This section used to answer a different question, and the answer expired. It read: "There is no
# `.github/workflows/ci.yml` on `main`; it is #21, in flight on #102" — an argument that the two
# *could not yet* be joined, never that they *should not* be. #102 landed on 2026-08-07 and took the
# premise with it (#187, criterion 4).
#
# The reason that survives is the **trigger**, and it has nothing to do with builds. This workflow is
# `pull_request`-only so a toolchain drift can never leave `main` red; `ci.yml` carries
# `push: [main]` deliberately, because a *test* failure on `main` should redden it. Those two want
# opposite things, and a single workflow can only have both by putting a conditional on the assertion
# step — a conditional guarding this repository's never-red-`main` rule, whose reason would live only
# in a comment. Measured in #187, merging them saves roughly 10 further billed minutes on top of what
# the split below already saves. That is not a good trade.
name: swift-floor

# Pull requests only, deliberately. A drift failure is a prompt to re-measure, and it must not land on
# `main` as a red default branch — this repository's rule is that the default branch is never red.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# This repository is private and macOS runner minutes bill at 10×, and `pull_request` includes
# `synchronize`, so the repo's own `implement-issue` flow — one commit per plan task — stacks a run
# per commit. Superseded runs measure a tree nobody will merge, so cancel them.
#
# ⚠️ Since #187 the minutes argument is mostly `ci.yml`'s rather than this file's: this job compiles
# nothing and bills one minute, where the pair used to bill 60–70. This block is kept anyway, and not
# out of symmetry — a bare minute still bills at 10×, and a stack of superseded assertion runs is
# still noise on a pull request that has none of the usual reason to tolerate it.
#
# A bare `true` is correct *here*, unlike in `ci.yml`, and the difference is worth stating because the
# two blocks otherwise look copy-pasted: this workflow has no `push` trigger, so there is no run whose
# verdict is the only one a commit will ever get. `ci.yml` scopes its own to `pull_request` for
# exactly that reason (#133, #227).
#
# The failure this avoids is specific, not hygiene: an exhausted macOS allowance makes Actions jobs
# fail in 3–4 seconds with zero steps — a check that is red for a reason unrelated to the floor and
# measuring nothing at all. That is the "decorative check is worse than none" state this file's
# header argues against, reached by a third route.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  floor:
    # Carries Swift 6.3.x, which is the declared floor's major.minor. When this image moves to 6.4 the
    # assertion below goes red on purpose — see "Why it also fails when the runner is NEWER".
    #
    # ⚠️ This literal and `ci.yml`'s must stay equal, and the parity step below is what enforces it
    # rather than this sentence. Changing one without the other is the silent failure the header
    # describes.
    runs-on: macos-26
    # Was 30 while this job compiled the package. It now runs a handful of string comparisons — 9
    # seconds, measured — so a run that takes minutes is a hung runner rather than a slow build, and
    # the bound should say so. 3 rather than 10 because the bound is also a spending cap: a hung
    # macOS runner bills its timeout ×10, and 10 minutes would be 100 billed minutes, several times
    # the saving this whole change buys. `cancel-in-progress` does not reap a hang — nothing
    # supersedes it — so this number is the only thing that does.
    timeout-minutes: 3

    # ⛔ Nothing to cache here any more, and that is structural rather than a decision left open: as
    # of #187 this job compiles nothing. The no-cache argument has moved to `ci.yml`, beside the
    # build it now protects — a warning is only useful in the file where someone would be tempted,
    # and that stopped being this one.

    steps:
      - uses: actions/checkout@v7

      # ✅ **This gate has been seen to fail, on a runner, by name** — #187 Task 4, because a gate
      # nobody has watched fail is a gate nobody has tested. Probe: point this job at `macos-15` and
      # push (run `31256151345`). It went red in 13 seconds with
      #
      #     declared floor : 6.3.1  (major.minor 6.3)
      #     runner toolchain: 6.1.2  (major.minor 6.1)
      #     ##[error]The runner's Swift is OLDER than the declared floor (6.1.2 < 6.3.1).
      #
      # 6.1.2 is the toolchain #116 measured as unable to build this package at all, so the probe
      # exercised the real thing: a named refusal instead of an inference error deep in a SwiftUI
      # target. ⚠️ Note 6.1.2 is what `swift` resolves to *by default* on that image — not a
      # contradiction of the "macos-15 tops out at 6.2.4" figure in `CLAUDE.md`, which is about the
      # newest Xcode installed there rather than the selected one. Re-run the probe the same way; it
      # is cheap now precisely because this job no longer builds.
      - name: The runner's toolchain against the floor Package.swift declares
        run: |
          # ⚠️ `set +e`, and it is the whole reason the diagnostics below can ever print. GitHub
          # invokes `run:` as `bash -e {0}`, and `set` can only turn options ON — `set -uo pipefail`
          # does not clear `errexit`. With it left on, a missing `swift` or a moved `Package.swift`
          # makes the assignment's pipeline non-zero and the step dies right there, so the two
          # carefully-worded "could not read a version" errors never reach the log. The step still
          # fails, so the safety property held; the *actionable* property this file claims did not.
          set +e
          set -uo pipefail

          # ⚠️ And no `| head -1` anywhere, for a sibling reason. With `pipefail` on, `producer |
          # head -1` fails the pipeline whenever `head` exits first and the producer takes SIGPIPE —
          # a step that aborts on nothing, at a rate set by how fast two processes happen to run. It
          # passed every time on a manifest this small and would have gone off on a bigger one. First
          # lines are `${var%%$'\n'*}`, which starts no second process at all.
          declared_all=$(sed -n 's|^// *swift-tools-version: *\([0-9][0-9.]*\).*|\1|p' ElliotKit/Package.swift)
          declared=${declared_all%%$'\n'*}
          runner_all=$(swift --version 2>&1 | sed -n 's/.*Apple Swift version \([0-9][0-9.]*\).*/\1/p')
          runner=${runner_all%%$'\n'*}

          # An unparsed version must never read as a pass. Both of these are scraped out of text that
          # is free to change shape — a manifest comment and a compiler banner — and the failure mode
          # of a silently empty variable is a green check that compared nothing against nothing.
          if [ -z "$declared" ]; then
            echo "::error::Could not read swift-tools-version from ElliotKit/Package.swift."
            echo "The first line must match '// swift-tools-version: <x.y>'. Read it, do not assume it."
            exit 1
          fi
          if [ -z "$runner" ]; then
            echo "::error::Could not read a version out of 'swift --version' on this runner."
            swift --version 2>&1 || true
            exit 1
          fi

          d_mm=$(echo "$declared" | cut -d. -f1,2)
          r_mm=$(echo "$runner"   | cut -d. -f1,2)

          echo "declared floor : $declared  (major.minor $d_mm)"
          echo "runner toolchain: $runner  (major.minor $r_mm)"
          # A list item, not a bare line: the next step appends a second one, and consecutive plain
          # lines render as a single run-on paragraph in GitHub-flavoured markdown.
          echo "- declared floor \`$declared\`, runner \`$runner\`" >> "$GITHUB_STEP_SUMMARY"

          # BELOW the floor, at FULL precision — see "The two comparisons are at different
          # precisions" above. `sort -V` and not string order: 6.10 sorts below 6.9 lexically, and
          # 6.3.10 below 6.3.9, both of which are futures rather than hypotheticals.
          sorted=$(printf '%s\n%s\n' "$declared" "$runner" | sort -V)
          lowest=${sorted%%$'\n'*}
          if [ "$runner" != "$declared" ] && [ "$lowest" = "$runner" ]; then
            echo "::error::The runner's Swift is OLDER than the declared floor ($runner < $declared)."
            echo "The runner image moved down, or the floor moved up without this job's image moving with it."
            echo "This is a named failure on purpose: without it the same mismatch surfaces as an"
            echo "inference error a few hundred lines into a SwiftUI target, which is #116 verbatim."
            exit 1
          fi

          # At or above it. A patch above is still the floor's own release train — measured across
          # 6.2→6.2.4 and 6.3.1→6.3.3, the verdict on this package never moved within a minor — so
          # only a minor drift means the floor has stopped being exercised.
          if [ "$d_mm" = "$r_mm" ]; then
            echo "✓ The runner is at or within a patch of the declared floor."
            echo "  What exercises it is ci.yml's 'swift test', on the image the next step pins to this one."
            exit 0
          fi
          # A whole minor above, then.
          echo "::error::The runner's Swift is NEWER than the declared floor ($runner > $declared)."
          echo "Nothing is exercising the declared floor any more, so this job would pass while"
          echo "measuring a toolchain nobody declared — coverage in appearance only."
          echo "Two ways out, and both are fine:"
          echo "  1. Re-measure. If the package still builds AND tests on $declared, pin a $declared"
          echo "     toolchain here. If it no longer does, raise the floor in ElliotKit/Package.swift"
          echo "     to what you measured, and correct CLAUDE.md and .claude/skills/repo-profile.md"
          echo "     with it — #116 exists because those three drifted apart."
          echo "  2. Raise the floor to what you measured on $runner, which is what #116 itself did."
          echo "Do not silence this by widening the comparison: a floor nothing builds on is the bug."
          exit 1

      # The assertion above says the toolchain IS the floor. Something still has to say the floor
      # WORKS — #116's defect was a declared floor no build had ever met, and neither half is the
      # criterion alone. Since #187 that half is `ci.yml`'s `swift test`, which compiles all eight
      # test targets and then runs them.
      #
      # Which leaves this job's assertion covering the floor only if `ci.yml` runs on the image
      # asserted above. That is a join between two files, and this repository's entire argument is
      # that a claim nothing exercises is not a guarantee — so it is checked here rather than asked
      # for in a comment. A string comparison; no build, no toolchain, seconds.
      #
      # ⚠️ Note which direction is dangerous. If `ci.yml` moved to an OLDER image, its own compile
      # would fail loudly (measured in #116: every 6.2.x builds this package and cannot compile the
      # tests). If it moved to a NEWER one, everything would stay green while nothing exercised the
      # declared floor — green, silent, and wrong. That is the case this step exists for.
      #
      # Verification status, stated precisely because the two halves were established differently:
      # the **pass** path ran on a real `macos-26` runner (`31255937877`) and printed both images, so
      # the parsing is runner-verified; the **failure** paths were exercised locally against the real
      # files — a drifted copy (`macos-26` vs `macos-15` → exit 1, named) and an absent `ci.yml`
      # (→ exit 1, named). Both machines run bash 3.2, and everything after the parsing is a string
      # comparison. What has *not* happened is watching this step go red on a runner; that costs a
      # push with the two images deliberately parted, and it was judged not worth ~20 billed minutes
      # on a change whose subject is billed minutes. Do it if you touch the parsing.
      - name: ci.yml still compiles this package, on this image
        run: |
          # `set +e` and the absence of `| head -1` are load-bearing here for the same two reasons
          # they are load-bearing above; the argument is written out once, over that step, and this
          # is a reference to it rather than a second copy of it. (Each `run:` is its own shell, so
          # the two `set` lines cannot be shared — only the reasoning can.)
          set +e
          set -uo pipefail

          # A quoted scalar is valid YAML and identical in meaning, so tolerate quotes rather than
          # failing on `runs-on: "macos-26"` with a message about ci.yml being deleted.
          runs_on_re='^ *runs-on: *["'\'']\{0,1\}\([A-Za-z0-9._-]\{1,\}\)["'\'']\{0,1\} *$'
          read_images() { sed -n "s|$runs_on_re|\1|p" "$1"; }

          floor_all=$(read_images .github/workflows/swift-floor.yml)
          ci_all=$(read_images .github/workflows/ci.yml)
          floor_image=${floor_all%%$'\n'*}
          ci_image=${ci_all%%$'\n'*}

          # An unparsed image must never read as a pass, for the same reason an unparsed version must
          # not: the failure mode is a green check that compared nothing against nothing. A renamed
          # or deleted `ci.yml` lands here, and it should — it means nothing is compiling the floor.
          if [ -z "$floor_image" ] || [ -z "$ci_image" ]; then
            echo "::error::Could not read a 'runs-on:' image from both workflows."
            echo "swift-floor.yml -> '${floor_image:-<none>}'   ci.yml -> '${ci_image:-<none>}'"
            echo "If ci.yml was renamed or removed, then nothing compiles the declared floor any more"
            echo "and this job must not pass: give it back its own build step, or fix the path here."
            echo "If the value is an expression (\${{ matrix.os }}) this check cannot read it, and"
            echo "the honest fix is to compare something else — not to widen this pattern until it"
            echo "matches text it cannot evaluate."
            exit 1
          fi

          # ⚠️ Taking the FIRST `runs-on:` silently compares the wrong job the moment either file has
          # two. That is not hypothetical — a `lint` job added above `build-and-test` would do it —
          # and the dangerous direction is a second *macOS* job declared first, which would compare a
          # job that is not the one compiling. So the single-job assumption is asserted, not relied on.
          floor_n=$(printf '%s\n' "$floor_all" | grep -c .)
          ci_n=$(printf '%s\n' "$ci_all" | grep -c .)
          if [ "$floor_n" != 1 ] || [ "$ci_n" != 1 ]; then
            echo "::error::This check assumes one job per workflow, and that has stopped being true."
            echo "swift-floor.yml declares $floor_n 'runs-on:' lines, ci.yml declares $ci_n."
            echo "It compares the first of each, so it would now be comparing a job that may not be"
            echo "the one running 'swift test'. Name the job explicitly here before adding another."
            exit 1
          fi

          echo "swift-floor.yml (this job) : $floor_image"
          echo "ci.yml (compiles the tests): $ci_image"

          if [ "$floor_image" != "$ci_image" ]; then
            echo "::error::The two workflows no longer run on the same image ($floor_image vs $ci_image)."
            echo "The assertion above measured the toolchain on $floor_image, but the eight test targets"
            echo "are compiled by ci.yml's 'swift test' on $ci_image. So nothing is exercising the"
            echo "declared floor, while this job goes on passing — #116 verbatim, by a fourth route."
            echo "Two ways out, and both are fine:"
            echo "  1. Put both workflows back on one image, whichever one you meant to move to."
            echo "  2. Give this job its own 'swift build --build-tests' step again and accept the"
            echo "     duplicate compile #187 removed — the minutes were the only reason it went."
            exit 1
          fi

          # The image is only half of it. This job's claim is that ci.yml compiles this package on
          # that image, and there are two cheap ways for that to stop being true without anyone
          # touching `runs-on:`. Both are grep-able, so neither is left to a comment asking for care.
          if ! grep -q 'swift test' .github/workflows/ci.yml; then
            echo "::error::ci.yml no longer runs 'swift test', so nothing compiles the eight test targets."
            echo "Since #187 that command carries the floor guarantee as well as the test coverage:"
            echo "'swift build' alone certified 6.2 and was wrong by four releases (#116)."
            exit 1
          fi
          if grep -qE 'setup-xcode|DEVELOPER_DIR|xcode-select' .github/workflows/ci.yml; then
            echo "::error::ci.yml selects its own toolchain, so the image no longer implies the version."
            echo "This job asserted Swift on $floor_image; ci.yml would compile on whatever it selects,"
            echo "and the two could differ while both files still read '$ci_image'."
            echo "Assert the version inside that job instead of inferring it from the runner label."
            exit 1
          fi
          if grep -qE '^ *paths(-ignore)?:' .github/workflows/ci.yml; then
            echo "::error::ci.yml filters on changed paths, so it can be skipped on a pull request."
            echo "On a run where it is skipped, nothing compiles and this job would still go green"
            echo "claiming the floor was exercised. If you want that filter, give this job the same"
            echo "one, or stop it claiming what ci.yml did."
            exit 1
          fi

          # ⚠️ What is established, stated exactly, because the previous wording claimed more than it
          # checked: both workflows *declare* the same runner label, ci.yml *contains* a `swift test`
          # and does not override the toolchain or filter itself out. What is still assumed is that a
          # label means one image at one moment — two runs can straddle a GitHub image rollout — and
          # that ci.yml's job was not skipped by a job-level `if:`, which grep cannot tell from a
          # step-level one. Read this job green as "the floor is asserted and nothing has quietly
          # decoupled ci.yml from it", never as "the test targets compiled": that is ci.yml's own
          # check to report, and it reports it.
          echo "✓ Both workflows declare $ci_image, and ci.yml still runs 'swift test' on it."
          summary="- floor image \`$floor_image\` == ci image \`$ci_image\`"
          echo "$summary, and ci.yml runs \`swift test\`" >> "$GITHUB_STEP_SUMMARY"
