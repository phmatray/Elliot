# The floor `Package.swift` declares, held true by something other than goodwill (#116, criterion 4).
#
# ### What rotted, and what this catches
#
# `swift-tools-version` said 6.1 for months while the sources needed more. Nothing noticed, for one
# structural reason: **no machine other than the author's had ever compiled the package.** The first
# runner that tried failed in under two minutes. A declared floor with nothing exercising it is not a
# weak guarantee, it is no guarantee — it is a comment that happens to sit in a manifest.
#
# So this job does not *read* the floor and reason about it. It builds on it.
#
# ### Why it also fails when the runner is NEWER than the floor
#
# That reads like pedantry and is the whole point. If the image moves to a toolchain above the
# declared floor, this job goes on passing while measuring **a different toolchain than the one
# declared** — which is exactly the state the repository was in before #116, reached by a different
# route. The check would then be decorative, and a decorative check is worse than none, because it
# looks like coverage.
#
# The failure is deliberately actionable rather than merely loud: it names both ways out (re-measure
# and raise the floor, or pin the toolchain) and it should fire roughly once per Xcode release, not
# once per pull request.
#
# ⛔ It is compared at **major.minor**, so a patch bump (6.3.1 → 6.3.3) is not drift. `swift-tools-
# version` has no patch component, so treating one as drift would be inventing precision the declared
# value does not carry.
#
# ### Why there is no second, lower leg
#
# #116 chose to **raise** the floor rather than repair the sources for 6.1, so there is no older
# toolchain left to exercise. That absence is a decision, not an omission. Under the other outcome
# this file would carry a `macos-15` build leg to keep the 6.1 claim honest on every pull request.
#
# ### Why this is not `ci.yml`
#
# There is no `.github/workflows/ci.yml` on `main`; it is #21, in flight on #102. Editing a file that
# does not exist yet would either collide with that pull request or be unexercisable until it lands —
# and an unexercised check is the exact thing #116 is about. A separate file runs on the pull request
# that adds it, which is how Task 5's last step could be verified at all.
name: swift-floor

# Pull requests only, deliberately. A drift failure is a prompt to re-measure, and it must not land on
# `main` as a red default branch — this repository's rule is that the default branch is never red.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  floor:
    # Carries Swift 6.3.x, which is the declared floor's major.minor. When this image moves to 6.4 the
    # assertion below goes red on purpose — see "Why it also fails when the runner is NEWER".
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: The runner's toolchain against the floor Package.swift declares
        run: |
          set -uo pipefail

          # ⚠️ No `| head -1` anywhere in this step, deliberately. GitHub runs `run:` under `bash -e`,
          # and with `pipefail` on, `producer | head -1` fails the whole pipeline whenever `head`
          # exits first and the producer takes SIGPIPE — a step that aborts on nothing, at a rate set
          # by how fast two processes happen to run. It would have passed every time on a manifest
          # this small and gone off on a bigger one. First lines are taken with `${var%%$'\n'*}`,
          # which involves no second process at all.
          declared_all=$(sed -n 's|^// *swift-tools-version: *\([0-9][0-9.]*\).*|\1|p' ElliotKit/Package.swift)
          declared=${declared_all%%$'\n'*}
          runner_all=$(swift --version 2>&1 | sed -n 's/.*Apple Swift version \([0-9][0-9.]*\).*/\1/p')
          runner=${runner_all%%$'\n'*}

          # An unparsed version must never read as a pass. Both of these are scraped out of text that
          # is free to change shape — a manifest comment and a compiler banner — and the failure mode
          # of a silently empty variable is a green check that compared nothing against nothing.
          if [ -z "$declared" ]; then
            echo "::error::Could not read swift-tools-version from ElliotKit/Package.swift."
            echo "The first line must match '// swift-tools-version: <x.y>'. Read it, do not assume it."
            exit 1
          fi
          if [ -z "$runner" ]; then
            echo "::error::Could not read a version out of 'swift --version' on this runner."
            swift --version 2>&1 || true
            exit 1
          fi

          # major.minor only: swift-tools-version has no patch component (see the ⛔ note above).
          d_mm=$(echo "$declared" | cut -d. -f1,2)
          r_mm=$(echo "$runner"   | cut -d. -f1,2)

          echo "declared floor : $declared  (major.minor $d_mm)"
          echo "runner toolchain: $runner  (major.minor $r_mm)"
          echo "declared floor \`$declared\`, runner \`$runner\`" >> "$GITHUB_STEP_SUMMARY"

          if [ "$d_mm" = "$r_mm" ]; then
            echo "✓ The runner is at the declared floor. The build below therefore exercises it."
            exit 0
          fi

          # `sort -V` decides which side of the floor the runner fell on, so the two failures can say
          # different things — they have genuinely different remedies. Version order, not string
          # order: 6.10 sorts *below* 6.9 lexically, and that is a real future, not a hypothetical.
          sorted=$(printf '%s\n%s\n' "$d_mm" "$r_mm" | sort -V)
          lower=${sorted%%$'\n'*}
          if [ "$lower" = "$r_mm" ]; then
            echo "::error::The runner's Swift is OLDER than the declared floor ($runner < $declared)."
            echo "The runner image moved down, or the floor moved up without this job's image moving with it."
            echo "This is a named failure on purpose: without it the same mismatch surfaces as an"
            echo "inference error a few hundred lines into a SwiftUI target, which is #116 verbatim."
          else
            echo "::error::The runner's Swift is NEWER than the declared floor ($runner > $declared)."
            echo "Nothing is exercising the declared floor any more, so this job would pass while"
            echo "measuring a toolchain nobody declared — coverage in appearance only."
            echo "Two ways out, and both are fine:"
            echo "  1. Re-measure. If the package still builds AND tests on $declared, pin a $declared"
            echo "     toolchain here. If it no longer does, raise the floor in ElliotKit/Package.swift"
            echo "     to what you measured, and correct CLAUDE.md and .claude/skills/repo-profile.md"
            echo "     with it — #116 exists because those three drifted apart."
            echo "  2. Raise the floor to $r_mm after measuring, which is what #116 itself did."
            echo "Do not silence this by widening the comparison: a floor nothing builds on is the bug."
          fi
          exit 1

      # The assertion above says the toolchain IS the floor. This says the floor WORKS. Neither alone
      # is the criterion: #116's defect was a declared floor that no build had ever met.
      - name: Build on the declared floor
        working-directory: ElliotKit
        run: swift build

      # `swift build` compiles the library and executable targets only, so it leaves all eight test
      # targets unmeasured — and that is not a footnote here. Measured in #116: every Swift 6.2.x
      # builds this package green and *cannot compile the tests*, so a floor checked by `swift build`
      # alone would have certified 6.2 and been wrong by four releases.
      #
      # `--build-tests` rather than `swift test`: the claim under guard is that the floor can compile
      # this package, not that the suite passes — that is #21's job, and running the suite twice buys
      # nothing for the minutes.
      - name: Compile the test targets on the declared floor
        working-directory: ElliotKit
        run: swift build --build-tests
