name: CI

# `branches: [main]` is correct *here* because `main` genuinely is this repository's default
# branch. The same two lines are a latent bug in any repository whose default is something else
# — the job is then silently skipped on every pull request, which looks exactly like a repository
# that has no CI at all. If the default branch is ever renamed, rename it here too.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# This job reads the repository and nothing else. Stating that here rather than inheriting it means
# a later change to the repository or organisation default cannot silently hand `GITHUB_TOKEN`
# write scope to a job that runs unreviewed code from a pull request.
permissions:
  contents: read

jobs:
  build-and-test:
    # NOT `macos-15`, though `Package.swift` says `swift-tools-version: 6.1` and
    # `platforms: [.macOS(.v15)]`. Measured on run 31118743562: that image carries Swift 6.1.2,
    # and the package does not compile on it — `BoardStore.swift:237` fails with "for-in loop
    # requires '()' to conform to 'Sequence'", a closure-return inference the 6.1 type checker
    # does not make. The tools-version is the floor the *manifest* is parsed at; it is not a
    # promise about the sources. `macos-26` carries Swift 6.3, which is what this package is
    # actually developed against. Don't lower this without building on the lower toolchain first.
    runs-on: macos-26
    # The suite is deterministic and runs in about half a second; the minutes are checkout and
    # toolchain. A job that runs long is a hang, not a slow test — bound it so it goes red
    # instead of sitting in the queue.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # Its own line, so a runner-image toolchain drift reads as a version rather than as a
      # mystery compile error further down.
      - name: Toolchain
        run: swift --version

      # The end-to-end suite spawns this script instead of the real `claude`. git carries the
      # mode bit, but assert it rather than assume it — a lost +x presents as a spawn failure.
      - name: fake-claude is executable
        run: test -x Scripts/fake-claude.sh

      - name: Build
        run: swift build
        working-directory: ElliotKit

      - name: Test
        run: swift test
        working-directory: ElliotKit
