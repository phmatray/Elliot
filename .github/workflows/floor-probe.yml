# TEMPORARY — measurement only, for issue #116. Task 5 of that plan deletes it.
#
# Triggers on push to this issue's branch and nothing else. It must never gate a pull request, and
# `workflow_dispatch` is unavailable because a dispatchable workflow has to exist on the default
# branch first — `.github/` does not exist on `main` at all until #21 lands.
#
# The question. The manifest says `swift-tools-version: 6.1` and nothing has ever built the package
# on a 6.1 toolchain; `macos-15` carries Apple Swift 6.1.2. Run 31118743562 died at the FIRST error,
# in `ElliotStore`, which every other target depends on — so nothing past it was type-checked and
# "one error" is a lower bound of unknown tightness.
#
# Two things this probe does that the previous one (run 31123727599) did not:
#
#   1. It builds the TEST targets too. `swift build` compiles library and executable targets only,
#      so a green `swift build` leaves `ElliotModelTests`, `ElliotEngineTests`, `ElliotAppKitTests`
#      and the rest entirely unmeasured — and those are substantial. The two runs are reported
#      separately because they are two different floors, and conflating them is how the first one
#      rotted.
#   2. It runs against current `main`. The earlier probe branch is ~4 000 lines behind, so its
#      count described a tree that no longer exists.
#
# And one thing THIS revision adds, because run 31167517846 closed the lower half of the bracket and
# left the upper half asserted rather than measured. That run establishes that 6.1.2 is RED. Nothing
# had ever established what is GREEN: `macos-26` is called "Swift 6.3" in a comment on #102's
# `ci.yml`, and this plan's global constraint is that no conclusion may rest on reading a comment.
# So the `green-floor` job below builds under **every** Xcode the image carries, not just the
# selected one — which is also the only way to answer the spec's open edge case, "6.2 is untested,
# do not write it down as supported or unsupported without building it". A floor raised to the
# lowest toolchain measured green is minimal; one raised to the toolchain that happens to be
# default is merely sufficient.
name: floor-probe

on:
  push:
    branches: [fix/116-swift-floor]

permissions:
  contents: read

jobs:
  swift-61:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Its own step: this whole issue exists because a label was assumed to imply a version.
      - name: Toolchain
        run: |
          swift --version
          sw_vers

      # `continue-on-error` throughout: the job is a probe, not a gate. A failure must still leave a
      # readable log for the counting step below.
      - name: swift build (library + executable targets)
        continue-on-error: true
        working-directory: ElliotKit
        run: |
          set -o pipefail
          swift build 2>&1 | tee /tmp/build.log

      - name: swift build --build-tests (adds the test targets)
        continue-on-error: true
        working-directory: ElliotKit
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee /tmp/build-tests.log

      # The whole point of the probe: the complete list, not the first line.
      - name: Every error, deduplicated
        if: always()
        run: |
          # Every list below is printed through this helper rather than `grep … || echo "(none)"`.
          # That idiom is dead code: the `||` tests the *pipeline*, and `sort` exits 0 on empty
          # input, so an empty result printed as a blank line and "no errors found" was
          # indistinguishable from "the grep produced nothing because the log was not what I
          # thought". An empty measurement has to say so out loud.
          show() {
            local out
            out=$(eval "$1")
            if [ -z "$out" ]; then echo "(none)"; else echo "$out"; fi
          }

          for log in /tmp/build.log /tmp/build-tests.log; do
            echo "############ $log ############"
            [ -f "$log" ] || { echo "(step never ran)"; continue; }
            echo "=== error lines ==="
            show "grep -E '^[^ ].*: error: ' '$log' | sort -u"
            echo "=== count of distinct error lines ==="
            grep -E '^[^ ].*: error: ' "$log" | sort -u | wc -l | tr -d ' '
            # Derived from the ERROR lines only. Grepping the whole log for `^/…\.swift` also
            # matches compile-progress lines, so a clean target listed files that had nothing
            # wrong with them — a probe that names innocent files is worse than one that names none.
            echo "=== distinct files carrying an error ==="
            show "grep -E '^[^ ].*: error: ' '$log' | grep -oE '^/[^:]+\.swift' | sort -u"
            echo "=== modules the compiler reached ==="
            show "grep -oE 'Compiling [A-Za-z]+' '$log' | sort -u"
          done

  # Which toolchain is the LOWEST that builds this package green — measured, not inferred from an
  # image label. Every Xcode on the image is tried, oldest first, so if the image carries a 6.2 the
  # answer is 6.2 and not "whatever was selected".
  green-floor:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The inventory is a result in its own right, and is printed before anything is built: it is
      # what says whether a 6.2 measurement was even available to take. An absent toolchain has to
      # read as "could not be measured here", never as "does not work".
      - name: What toolchains does this image actually carry
        run: |
          sw_vers
          echo "selected DEVELOPER_DIR: $(xcode-select -p)"
          echo "selected swift:"; swift --version
          for x in /Applications/Xcode*.app; do
            [ -d "$x" ] || continue
            echo "=== $x ==="
            "$x/Contents/Developer/usr/bin/swift" --version 2>&1 | head -2
            "$x/Contents/Developer/usr/bin/xcodebuild" -showsdks 2>&1 | grep -i macos || echo "  (no macOS SDK listed)"
          done

      - name: Build under every Xcode on the image
        continue-on-error: true
        working-directory: ElliotKit
        run: |
          # `set +e` deliberately, against the `bash -e` GitHub runs steps under. Without it the
          # loop aborts on the first toolchain that fails to build — which is the one case this job
          # exists to look past, and it would report "no 6.2 measurement" as if none were available.
          set +e
          set -o pipefail
          # A per-Xcode build directory. Sharing one `.build` across toolchains is the CI form of
          # the stale-`.build` trap CLAUDE.md documents: the second compiler reads the first one's
          # modules and fails in ways that have nothing to do with its own version.
          for x in /Applications/Xcode*.app; do
            [ -d "$x" ] || continue
            tag=$(basename "$x" .app)
            export DEVELOPER_DIR="$x/Contents/Developer"
            ver=$("$DEVELOPER_DIR/usr/bin/swift" --version 2>&1 | head -1)
            echo "######## $tag — $ver ########"
            swift build --scratch-path "/tmp/build-$tag" 2>&1 | tee "/tmp/$tag-build.log"
            echo "---- $tag swift build exit: $? ----"
            swift build --build-tests --scratch-path "/tmp/build-$tag" 2>&1 | tee "/tmp/$tag-build-tests.log"
            echo "---- $tag swift build --build-tests exit: $? ----"
          done
          exit 0

      # Green is not "the step went green": `continue-on-error` above means the step always does.
      # The verdict has to be re-derived from the logs, per toolchain, the same way the 6.1 job
      # derives its count — one rule, applied twice.
      - name: Verdict per toolchain
        if: always()
        run: |
          set +e
          shopt -s nullglob
          logs=(/tmp/Xcode*-build.log /tmp/Xcode*-build-tests.log)
          # An empty measurement must say so out loud — the same rule the 6.1 job's `show` helper
          # exists for. Zero logs and "every log was green" print identically otherwise.
          if [ ${#logs[@]} -eq 0 ]; then echo "(no build log at all — the build step never ran)"; exit 0; fi
          for log in "${logs[@]}"; do
            n=$(grep -cE '^[^ ].*: error: ' "$log")
            echo "############ $(basename "$log") — $n distinct-ish error lines ############"
            if [ "$n" -eq 0 ]; then
              echo "GREEN"
            else
              grep -E '^[^ ].*: error: ' "$log" | sort -u
            fi
          done
